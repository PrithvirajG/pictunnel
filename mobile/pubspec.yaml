name: pictunnel
description: "PicTunnel mobile app (Flutter) with native backup engines."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  pictunnel_api:
    path: packages/pictunnel_api
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  go_router: 18.0.2
  drift: 2.34.4
  drift_flutter: 0.3.1
  sqlite3_flutter_libs: 0.6.0+eol
  path_provider: 2.1.6
  mobile_scanner: 7.4.2
  photo_view: 0.15.0
  video_player: 2.14.1
  share_plus: 13.3.1
  intl: 0.20.2
  crypto: 3.0.7
  collection: 1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 27.3.0
  build_runner: 2.15.1
  riverpod_generator: 4.0.4
  drift_dev: 2.34.0
  riverpod_lint: 3.1.4
  glados: 1.1.7
  mocktail: 1.0.5

flutter:
  uses-material-design: true
