version: "3"

vars:
  TOOLS_MODE: '{{.TOOLS_MODE | default "docker"}}'
  OPENAPI_GENERATOR_IMAGE: openapitools/openapi-generator-cli:v7.24.0
  GRADLE_IMAGE: gradle:9.3.0-jdk17
  SWIFT_IMAGE: swift:6.2
  GOLANGCI_LINT_VERSION: v2.14.0
  SWIFT_OPENAPI_GENERATOR_VERSION: 1.13.0
  FLUTTER_VERSION:
    sh: node tools/dev/read-version.mjs mobile/.flutter-version stable
  DART_IMAGE:
    sh: node tools/dev/read-version.mjs tools/dev/dart-image.txt dart:stable
  DOCKER_USER:
    sh: node tools/dev/docker-user.mjs
  DOCKER_RUN: docker run --rm {{.DOCKER_USER}} -e HOME=/tmp -v "{{.ROOT_DIR}}:/repo" -w /repo

tasks:
  doctor:
    desc: Verify required local tools are installed
    cmds:
      - go version
      - node --version
      - pnpm --version
      - uv --version
      - docker version

  check:eol:
    desc: Fail if a text file is committed with CRLF line endings
    cmds:
      - node tools/ci/check-eol.mjs

  test:tools:
    desc: Tests for repository check scripts
    cmds:
      - node --test "tools/ci/*.test.mjs" "tools/dev/*.test.mjs"

  # Prototype server on the LAN (docs/prototype-android.md): Docker Compose project
  # pictunnel-proto, data in the pictunnel-proto_pictunnel-data volume. Only proto:up uses
  # PICTUNNEL_LAN_IP; the other tasks set a placeholder because the compose file requires it.
  proto:up:
    desc: Build and start the PicTunnel server in Docker on this machine's LAN IP (override with LAN_IP=…)
    vars:
      LAN_IP:
        sh: node tools/dev/lan-ip.mjs
    env:
      PICTUNNEL_LAN_IP: "{{.LAN_IP}}"
    preconditions:
      - sh: '[ -n "{{.LAN_IP}}" ]'
        msg: "No LAN IPv4 address found. Pass it: task proto:up LAN_IP=192.168.1.20"
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d --build
      - 'echo "PicTunnel is starting on https://{{.LAN_IP}}:8443 (the phone pairs to this address). Next: task proto:pair"'

  proto:pair:
    desc: Print a pairing QR code (also deploy/pairing-qr.png); creates the admin on first run. Later runs need -- --password <pw>
    env:
      PICTUNNEL_LAN_IP: "0.0.0.0"
    cmds:
      - docker compose -f deploy/docker-compose.yml exec -T pictunnel pictunnel pair --create --png /tmp/pairing-qr.png {{.CLI_ARGS}}
      - docker compose -f deploy/docker-compose.yml cp pictunnel:/tmp/pairing-qr.png deploy/pairing-qr.png
      - echo "The QR code is also in deploy/pairing-qr.png (open it if the one above looks garbled)."

  proto:logs:
    desc: Follow the prototype server's logs (the certificate pin is printed at start)
    env:
      PICTUNNEL_LAN_IP: "0.0.0.0"
    cmds:
      - docker compose -f deploy/docker-compose.yml logs -f --tail 100

  proto:reset-password:
    desc: Set a new random password for ACCOUNT (default admin); stops the server for a moment
    vars:
      ACCOUNT: '{{.ACCOUNT | default "admin"}}'
    env:
      PICTUNNEL_LAN_IP: "0.0.0.0"
    cmds:
      - docker compose -f deploy/docker-compose.yml stop pictunnel
      - defer: docker compose -f deploy/docker-compose.yml start pictunnel
      - docker compose -f deploy/docker-compose.yml run --rm --no-deps pictunnel reset-password {{.ACCOUNT}}

  proto:down:
    desc: Stop the prototype server (photos, accounts and keys stay in the volume)
    env:
      PICTUNNEL_LAN_IP: "0.0.0.0"
    cmds:
      - docker compose -f deploy/docker-compose.yml down

  proto:wipe:
    desc: Stop the prototype server and DELETE its data volume (photos, accounts, keys; phones must pair again)
    prompt: This deletes every photo, account and key of the prototype server. Continue?
    env:
      PICTUNNEL_LAN_IP: "0.0.0.0"
    cmds:
      - docker compose -f deploy/docker-compose.yml down -v

  api:install:
    desc: Install API tooling dependencies
    cmds:
      - pnpm --dir api install --frozen-lockfile

  lint:api:
    desc: Lint the OpenAPI contract (Redocly + project rules)
    cmds:
      - pnpm --dir api run lint

  test:api:
    desc: Unit tests for API tooling
    cmds:
      - pnpm --dir api run test

  vectors:validate:
    desc: Validate conformance vectors (schema, semantics, minimum counts)
    cmds:
      - pnpm --dir api run vectors

  test:server:
    desc: Vet and test the Go server
    dir: server
    cmds:
      - go vet ./...
      - go test ./...

  test:server:race:
    desc: Test the Go server with the race detector (needs cgo and a C compiler)
    dir: server
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -timeout 30m ./...

  test:server:property:
    desc: Long property run of the sync invariants (CHECKS programs, default 500)
    dir: server
    vars:
      CHECKS: '{{.CHECKS | default "500"}}'
    cmds:
      - go test ./internal/app -run Property -rapid.checks={{.CHECKS}} -timeout 30m

  test:server:cover:
    desc: Coverage gate, 85% per package over service, repository and httpapi
    dir: server
    cmds:
      - go test -coverprofile=cover.out ./internal/service/... ./internal/repository/... ./internal/httpapi/...
      - go run ./tools/ci/covergate -min 85 -exclude '(/gen|test)$' cover.out

  test:interop:
    desc: tus-js-client interop test against a real server (server/test/interop/tus-js)
    dir: server/test/interop/tus-js
    cmds:
      - pnpm install --frozen-lockfile
      - node upload.mjs

  lint:server:
    desc: Lint the Go server with golangci-lint (pinned)
    dir: server
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...

  gen:go:
    desc: Generate Go server interfaces and models from the contract
    dir: server/internal/httpapi
    cmds:
      - go tool oapi-codegen -config oapi-codegen.yaml ../../../api/openapi.yaml
      - go mod tidy

  gen:sqlc:
    desc: Generate Go query code from SQL with sqlc
    dir: server
    cmds:
      - go tool sqlc generate -f internal/store/sqlc.yaml

  check:sqlc:
    desc: Fail if sqlc output differs from the SQL sources
    dir: server
    cmds:
      - go tool sqlc diff -f internal/store/sqlc.yaml

  gen:ts:
    desc: Generate TypeScript types for the web viewer
    cmds:
      - pnpm --dir web run gen:api

  test:web:
    desc: Type-check, test and build the web viewer
    cmds:
      - pnpm --dir web run check
      - pnpm --dir web run test
      - pnpm --dir web run build

  gen:engine-bundle:
    desc: Bundle the engine-only subset of the contract
    cmds:
      - pnpm --dir api run bundle:engine

  gen:kotlin:
    desc: Generate the Kotlin engine client from the engine subset
    deps: [gen:engine-bundle]
    cmds:
      - node tools/dev/rmrf.mjs mobile/android/engine-api/generated
      - >-
        {{.DOCKER_RUN}} {{.OPENAPI_GENERATOR_IMAGE}} generate
        -i /repo/api/build/engine-openapi.yaml -g kotlin
        -o /repo/mobile/android/engine-api/generated
        --additional-properties=packageName=io.github.prithvirajg.pictunnel.engineapi,library=jvm-okhttp4,serializationLibrary=kotlinx_serialization,enumUnknownDefaultCase=true,omitGradleWrapper=true,dateLibrary=java8
        --global-property=apiTests=false,modelTests=false,apiDocs=false,modelDocs=false

  test:kotlin:
    desc: Compile the Kotlin engine client and run its vector tests
    cmds:
      - >-
        {{if eq .TOOLS_MODE "native"}}cd mobile/android/engine-api && ./gradlew test --no-daemon{{else}}{{.DOCKER_RUN}} -w /repo/mobile/android/engine-api -e GRADLE_USER_HOME=/tmp/gradle {{.GRADLE_IMAGE}} gradle test --no-daemon{{end}}

  gen:swift:
    desc: Generate the Swift engine client from the engine subset (swift-openapi-generator in Docker)
    deps: [gen:engine-bundle]
    vars:
      GEN_DIR: /repo/.cache/swift-openapi-generator-{{.SWIFT_OPENAPI_GENERATOR_VERSION}}
    cmds:
      - node tools/dev/rmrf.mjs mobile/ios/EngineAPI/Sources/EngineAPI/Generated
      - >-
        {{.DOCKER_RUN}} {{.SWIFT_IMAGE}} bash -c "
        mkdir -p /repo/mobile/ios/EngineAPI/Sources/EngineAPI/Generated &&
        (test -d {{.GEN_DIR}} || git clone --depth 1 --branch {{.SWIFT_OPENAPI_GENERATOR_VERSION}} https://github.com/apple/swift-openapi-generator {{.GEN_DIR}}) &&
        swift run -j 1 --package-path {{.GEN_DIR}} -c release swift-openapi-generator generate
        --config /repo/mobile/ios/EngineAPI/openapi-generator-config.yaml
        --output-directory /repo/mobile/ios/EngineAPI/Sources/EngineAPI/Generated
        /repo/api/build/engine-openapi.yaml"

  test:swift:
    desc: Build the Swift engine client and run its vector tests
    cmds:
      - >-
        {{if eq .TOOLS_MODE "native"}}swift test -j 1 --package-path mobile/ios/EngineAPI{{else}}{{.DOCKER_RUN}} {{.SWIFT_IMAGE}} swift test -j 1 --package-path /repo/mobile/ios/EngineAPI --scratch-path /repo/.cache/engineapi-build{{end}}

  gen:dart:generate:
    desc: Regenerate the Dart client sources (internal step of gen:dart)
    internal: true
    cmds:
      - node tools/dev/rmrf.mjs mobile/packages/pictunnel_api
      - >-
        {{.DOCKER_RUN}} {{.OPENAPI_GENERATOR_IMAGE}} generate
        -i /repo/api/openapi.yaml -g dart-dio
        -o /repo/mobile/packages/pictunnel_api
        --additional-properties=pubName=pictunnel_api,pubLibrary=pictunnel_api,enumUnknownDefaultCase=true
        --global-property=apiTests=false,modelTests=false,apiDocs=false,modelDocs=false

  gen:dart:
    desc: Generate the Dart client package for the Flutter app (dependencies pinned by tools/dev/pictunnel_api.pubspec.lock)
    cmds:
      - task: gen:dart:generate
      - >-
        {{.DOCKER_RUN}} -w /repo/mobile/packages/pictunnel_api {{.DART_IMAGE}}
        bash -c "cp /repo/tools/dev/pictunnel_api.pubspec.lock pubspec.lock && dart pub get --enforce-lockfile && dart run build_runner build"

  gen:dart:update-lock:
    desc: Refresh tools/dev/pictunnel_api.pubspec.lock (resolves without enforcement, then copies the lock back)
    cmds:
      - task: gen:dart:generate
      - >-
        {{.DOCKER_RUN}} -w /repo/mobile/packages/pictunnel_api {{.DART_IMAGE}}
        bash -c "dart pub get && cp pubspec.lock /repo/tools/dev/pictunnel_api.pubspec.lock"

  gen:pigeon:
    desc: Generate the Flutter <-> engine Pigeon bridge (Dart, Kotlin, Swift) from mobile/pigeons/engine.dart
    cmds:
      - >-
        {{if eq .TOOLS_MODE "native"}}cd mobile && flutter pub get && dart run pigeon --input pigeons/engine.dart{{else}}{{.DOCKER_RUN}} -w /repo/mobile ghcr.io/cirruslabs/flutter:{{.FLUTTER_VERSION}} bash -c "flutter pub get && dart run pigeon --input pigeons/engine.dart"{{end}}

  test:mobile:
    desc: Analyze and test the Flutter app
    cmds:
      - >-
        {{if eq .TOOLS_MODE "native"}}cd mobile && flutter pub get && flutter analyze && flutter test{{else}}{{.DOCKER_RUN}} -w /repo/mobile ghcr.io/cirruslabs/flutter:{{.FLUTTER_VERSION}} bash -c "flutter pub get && flutter analyze && flutter test"{{end}}

  test:engine:android:
    desc: Android engine unit tests plus the real-server integration tests (builds pictunnel first, for Linux in Docker or for the host natively)
    vars:
      GRADLE_CMD: '{{.GRADLE_CMD | default "./gradlew"}}'
    cmds:
      - >-
        {{if eq .TOOLS_MODE "native"}}cd server && CGO_ENABLED=0 go build -o ../.cache/pictunnel{{exeExt}} ./cmd/pictunnel{{else}}{{.DOCKER_RUN}} -w /repo/server -e CGO_ENABLED=0 -e GOOS=linux -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod golang:1.27 go build -o /repo/.cache/pictunnel ./cmd/pictunnel{{end}}
      - >-
        {{if eq .TOOLS_MODE "native"}}cd mobile && flutter pub get && cd android && PICTUNNEL_BIN="{{.ROOT_DIR}}/.cache/pictunnel{{exeExt}}" {{.GRADLE_CMD}} :engine:testDebugUnitTest --no-daemon{{else}}{{.DOCKER_RUN}} -w /repo/mobile -e PICTUNNEL_BIN=/repo/.cache/pictunnel ghcr.io/cirruslabs/flutter:{{.FLUTTER_VERSION}} bash -c "flutter pub get && cd android && {{.GRADLE_CMD}} :engine:testDebugUnitTest --no-daemon"{{end}}

  test:engine:android:instrumented:
    desc: Android engine instrumented tests, the partial-access run and a bridge smoke launch (needs Flutter, the Android SDK and a booted API 34+ emulator or device on adb)
    cmds:
      - cd mobile && flutter pub get && flutter build apk --debug
      - bash tools/ci/android-instrumented.sh

  test:e2e:android:
    desc: Real backup end to end against pictunnel built from this checkout (needs Go, Flutter, the Android SDK, jq and a booted API 34+ emulator on adb)
    cmds:
      - cd server && CGO_ENABLED=0 go build -o ../.cache/pictunnel ./cmd/pictunnel
      - cd mobile && flutter pub get && flutter build apk --debug && cd android && ./gradlew :engine:assembleDebugAndroidTest --no-daemon
      - bash tools/ci/android-e2e.sh

  test:engine:ios:
    desc: iOS engine tests plus the real-server integration tests (natively on macOS with pinned TLS; in Docker on Linux Swift over the loopback HTTP listener)
    cmds:
      - >-
        {{if eq .TOOLS_MODE "native"}}cd server && CGO_ENABLED=0 go build -o ../.cache/pictunnel ./cmd/pictunnel{{else}}{{.DOCKER_RUN}} -w /repo/server -e CGO_ENABLED=0 -e GOOS=linux -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod golang:1.27 go build -o /repo/.cache/pictunnel ./cmd/pictunnel{{end}}
      - >-
        {{if eq .TOOLS_MODE "native"}}PICTUNNEL_BIN="{{.ROOT_DIR}}/.cache/pictunnel" swift test --package-path mobile/ios/Engine{{else}}{{.DOCKER_RUN}} -e PICTUNNEL_BIN=/repo/.cache/pictunnel {{.SWIFT_IMAGE}} swift test -j 1 --package-path /repo/mobile/ios/Engine --scratch-path /repo/.cache/engine-ios-build{{end}}

  test:ml:
    desc: Lint and test the ML worker
    cmds:
      - uv sync --project ml
      - uv run --project ml ruff check ml
      - uv run --project ml pytest ml

  setup:
    desc: Install JavaScript dependencies for api/ and web/
    cmds:
      - pnpm --dir api install --frozen-lockfile
      - pnpm --dir web install --frozen-lockfile

  gen:
    desc: Regenerate every client from api/openapi.yaml
    cmds:
      - task: gen:go
      - task: gen:sqlc
      - task: gen:ts
      - task: gen:kotlin
      - task: gen:swift
      - task: gen:dart
      - task: gen:pigeon

  lint:
    desc: Contract lint and repository checks
    cmds:
      - task: lint:api
      - task: lint:server
      - task: check:eol

  test:
    desc: Every test suite
    cmds:
      - task: test:tools
      - task: test:api
      - task: test:server
      - task: test:web
      - task: test:kotlin
      - task: test:swift
      - task: test:mobile
      - task: test:ml

  check:drift:
    desc: Fail if generated code differs from the commit
    cmds:
      - node tools/ci/check-clean.mjs

  ci:
    desc: Everything CI checks, runnable locally (start from a clean working tree)
    cmds:
      - task: setup
      - task: lint
      - task: vectors:validate
      - task: gen
      - task: check:drift
      - task: test
