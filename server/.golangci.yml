# golangci-lint v2 configuration for the server module.
# The depguard rules enforce the package layering of the server-core spec
# (S§2.1); the standard linter set stays enabled.
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # A repository is pure CRUD on one table: it never reaches up into
        # orchestration, transport or jobs.
        repository:
          files:
            - "**/internal/repository/**/*.go"
          deny:
            - pkg: github.com/PrithvirajG/pictunnel/server/internal/service
              desc: repository must not import service (S§2.1)
            - pkg: github.com/PrithvirajG/pictunnel/server/internal/httpapi
              desc: repository must not import httpapi (S§2.1)
            - pkg: github.com/PrithvirajG/pictunnel/server/internal/jobs
              desc: repository must not import jobs (S§2.1)
        # Services orchestrate repositories; they know nothing about HTTP.
        service:
          files:
            - "**/internal/service/*.go"
            - "!$test"
          deny:
            - pkg: github.com/PrithvirajG/pictunnel/server/internal/httpapi
              desc: service must not import httpapi (S§2.1)
        # Leaf packages import no domain package at all.
        leaf:
          files:
            - "**/internal/contenthash/*.go"
            - "**/internal/tlsutil/*.go"
            - "**/internal/storage/*.go"
            - "**/internal/media/probe/*.go"
            - "!$test"
          deny:
            - pkg: github.com/PrithvirajG/pictunnel/server/internal
              desc: contenthash, tlsutil, storage and media/probe import no domain package (S§2.1)

    errcheck:
      # Best-effort cleanup whose failure has no remedy (a deferred Close of
      # a file already read, removing a temp file on an error path).
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*github.com/PrithvirajG/pictunnel/server/internal/store.Store).Close
        - os.Remove
        - golang.org/x/sys/windows.CloseHandle
    staticcheck:
      # The v2 default set minus two quick-fix style suggestions.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1011"]

  exclusions:
    rules:
      # Tests ignore errors of cleanup and of writes to pipes they own.
      - path: _test.go
        linters: [errcheck]
    generated: lax
    paths:
      - internal/httpapi/gen
      - internal/store/queries
