openapi: 3.0.3
info:
  title: PicTunnel API
  version: 1.0.0
  description: |
    Wire contract for the PicTunnel server, API version 1.

    * Normative sync behavior is specified in `protocol/sync-protocol.md`.
    * Errors are RFC 9457 problem details (`application/problem+json`) with a stable `code`.
    * Response fields whose value set may grow are strings; their known values are listed
      in `x-known-values`. Clients must tolerate values they do not know.
    * Apps send `PicTunnel-Client: <platform>/<version>`. Below `min_client_version` the
      server answers `426` with code `client_too_old`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://{host}:{port}
    description: A PicTunnel server reached over the LAN or a user-supplied remote URL.
    variables:
      host:
        default: localhost
      port:
        default: "8443"
tags:
  - name: server
    description: Server identity and health.
  - name: auth
    description: First-run setup, login, token refresh and logout.
  - name: pairing
    description: One-time codes that pair a device with an account.
  - name: devices
    description: Devices paired with the caller's account.
  - name: sync
    description: Content check, change feed and snapshot.
  - name: uploads
    description: Resumable uploads (tus 1.0.0 profile, see sync-protocol.md).
  - name: assets
    description: Asset metadata, media, trash and tombstones.
  - name: engine
    description: Operations used by the native backup engines; generated for Kotlin and Swift.
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [server]
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags: [server]
      security: []
      responses:
        "200":
          description: The database is open and storage is writable.
          content:
            text/plain:
              schema:
                type: string
                example: ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/server/info:
    get:
      operationId: getServerInfo
      summary: Server identity, versions, capabilities and upload limits
      tags: [server, engine]
      security: []
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/setup:
    post:
      operationId: setupFirstAdmin
      summary: Create the first administrator account
      description: Only succeeds while the server has no users; afterwards returns 409 `setup_already_done`.
      tags: [auth]
      security: []
      parameters:
        - name: PicTunnel-Setup-Token
          in: header
          required: false
          description: First-run setup token printed once to the server log and stdout. Not required on the loopback listener; required on any other listener, where a missing or wrong token returns 403 `forbidden`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Administrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with a password
      description: "`mode: tokens` returns device credentials (apps, requires `device`). `mode: cookie` sets the `pt_session` cookie and returns a CSRF token (web viewer)."
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate the refresh token and issue a new access token
      description: Presenting the previous refresh token within 30 seconds of rotation returns the same successor pair. Later reuse revokes the device (`refresh_token_reused`).
      tags: [auth, engine]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current device session or web session
      tags: [auth]
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/pairing/codes:
    post:
      operationId: createPairingCode
      summary: Create a one-time pairing code for the caller's account
      tags: [pairing]
      responses:
        "201":
          description: Pairing code valid for 10 minutes, single use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/pairing/redeem:
    post:
      operationId: redeemPairingCode
      summary: Exchange a pairing code for device credentials
      tags: [pairing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "201":
          description: Device paired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: List the caller's paired devices
      tags: [devices]
      responses:
        "200":
          description: Devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    patch:
      operationId: updateDevice
      summary: Rename a device
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatch"
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    delete:
      operationId: revokeDevice
      summary: Revoke a device and all its tokens
      tags: [devices]
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/sync/check:
    post:
      operationId: checkContent
      summary: Batch content check by SHA-256
      description: Read-only except for linking `(device, local_id)` to existing assets. See sync-protocol.md §7.2.
      tags: [sync, engine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "200":
          description: One result per requested item, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sync/changes:
    get:
      operationId: getChanges
      summary: Delta change feed since a cursor
      description: "Calling without `cursor` returns 400 `cursor_required`; run a snapshot first. Cursors older than 90 days return 410 `cursor_expired`."
      tags: [sync]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Changes in sequence order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/sync/snapshot:
    get:
      operationId: getSnapshot
      summary: Full metadata snapshot, paged
      description: The first page carries `cursor` (change-log head at snapshot start). After the last page continue with `getChanges` from that cursor.
      tags: [sync]
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of assets ordered by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/uploads:
    options:
      operationId: optionsUploads
      summary: tus capability discovery
      tags: [uploads, engine]
      security: []
      responses:
        "204":
          description: Supported tus version, extensions and limits.
          headers:
            Tus-Resumable:
              $ref: "#/components/headers/TusResumable"
            Tus-Version:
              schema:
                type: string
                example: 1.0.0
            Tus-Extension:
              schema:
                type: string
                example: creation,creation-with-upload,termination,expiration,checksum
            Tus-Max-Size:
              schema:
                type: integer
                format: int64
            Tus-Checksum-Algorithm:
              schema:
                type: string
                example: sha256
    post:
      operationId: createUpload
      summary: Create an upload, optionally sending bytes in the same request
      description: Idempotent per `(owner, sha256)`. Outcomes and their precedence are defined in sync-protocol.md §7.3.
      tags: [uploads, engine]
      parameters:
        - $ref: "#/components/parameters/TusResumable"
        - $ref: "#/components/parameters/UploadLength"
        - $ref: "#/components/parameters/UploadMetadata"
        - $ref: "#/components/parameters/UploadChecksum"
      requestBody:
        required: false
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Upload session created, resumed, or resolved to an existing asset.
          headers:
            Tus-Resumable:
              $ref: "#/components/headers/TusResumable"
            Location:
              $ref: "#/components/headers/Location"
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
            Upload-Expires:
              $ref: "#/components/headers/UploadExpires"
            PicTunnel-Asset-Id:
              $ref: "#/components/headers/AssetId"
            PicTunnel-Asset-Created:
              $ref: "#/components/headers/AssetCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "423":
          $ref: "#/components/responses/Locked"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "460":
          $ref: "#/components/responses/ChecksumMismatch"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    head:
      operationId: getUploadOffset
      summary: Current offset of an upload
      tags: [uploads, engine]
      responses:
        "200":
          description: Upload state. `PicTunnel-Asset-Id` is present once finalized.
          headers:
            Tus-Resumable:
              $ref: "#/components/headers/TusResumable"
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
            Upload-Length:
              $ref: "#/components/headers/UploadLength"
            Upload-Expires:
              $ref: "#/components/headers/UploadExpires"
            PicTunnel-Asset-Id:
              $ref: "#/components/headers/AssetId"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                example: no-store
        "401":
          description: Missing or invalid credentials.
        "404":
          description: Unknown or expired upload; restart with createUpload.
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "423":
          description: "Another request holds the upload and the lock wait timed out. Code: `upload_locked` (no body on HEAD)."
        "426":
          description: "The app is older than `min_client_version`. Code: `client_too_old` (no body on HEAD)."
    patch:
      operationId: appendUpload
      summary: Append bytes at the current offset
      description: The request that completes the upload runs finalize (sync-protocol.md §7.4) before responding.
      tags: [uploads, engine]
      parameters:
        - $ref: "#/components/parameters/TusResumable"
        - $ref: "#/components/parameters/UploadOffset"
        - $ref: "#/components/parameters/UploadChecksum"
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Bytes accepted. Asset headers are present when this request finalized the upload.
          headers:
            Tus-Resumable:
              $ref: "#/components/headers/TusResumable"
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
            Upload-Expires:
              $ref: "#/components/headers/UploadExpires"
            PicTunnel-Asset-Id:
              $ref: "#/components/headers/AssetId"
            PicTunnel-Asset-Created:
              $ref: "#/components/headers/AssetCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`offset_mismatch`: the request's Upload-Offset differs from the server's. The current offset is returned."
          headers:
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "423":
          $ref: "#/components/responses/Locked"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "460":
          $ref: "#/components/responses/ChecksumMismatch"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
    delete:
      operationId: terminateUpload
      summary: Abandon an upload and delete its staged bytes
      tags: [uploads, engine]
      parameters:
        - $ref: "#/components/parameters/TusResumable"
      responses:
        "204":
          description: Terminated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/assets/{asset_id}:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAsset
      summary: Asset metadata
      tags: [assets]
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/assets/{asset_id}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAssetThumbnail
      summary: JPEG thumbnail or preview
      tags: [assets]
      parameters:
        - name: size
          in: query
          required: false
          schema:
            type: string
            enum: [thumb, preview]
            default: thumb
      responses:
        "200":
          description: "`thumb` is 320 px on the long edge, `preview` is 1600 px."
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/assets/{asset_id}/original:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAssetOriginal
      summary: Original bytes, with Range support
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Whole file.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/assets/{asset_id}/playback:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAssetPlayback
      summary: Browser-playable video (original or H.264 transcode)
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Whole video.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/assets/trash:
    post:
      operationId: trashAssets
      summary: Move assets to the trash
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetIdList"
      responses:
        "200":
          description: Per-asset outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/assets/restore:
    post:
      operationId: restoreAssets
      summary: Restore assets from the trash
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetIdList"
      responses:
        "200":
          description: Per-asset outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/assets/purge:
    post:
      operationId: purgeAssets
      summary: Permanently delete trashed assets and record tombstones
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetIdList"
      responses:
        "200":
          description: Per-asset outcome. Assets that are not trashed fail with `not_trashed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/trash/empty:
    post:
      operationId: emptyTrash
      summary: Purge every trashed asset of the caller
      tags: [assets]
      responses:
        "200":
          description: Number of purged assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyTrashResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/tombstones:
    get:
      operationId: listTombstones
      summary: Content the caller deliberately purged
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tombstones, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TombstonePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /api/v1/tombstones/{sha256}:
    parameters:
      - $ref: "#/components/parameters/Sha256Path"
    delete:
      operationId: deleteTombstone
      summary: Remove a tombstone so the content can be backed up again
      tags: [assets, engine]
      responses:
        "204":
          description: Removed, or there was no tombstone for this content (idempotent).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token (`pt_at_…`) issued by login, pairing or refresh.
    cookieAuth:
      type: apiKey
      in: cookie
      name: pt_session
      description: Web viewer session cookie. State-changing requests also send `X-CSRF-Token`.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by a previous call.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. The server may return fewer.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    PageToken:
      name: page_token
      in: query
      required: false
      description: Opaque token for the next snapshot page.
      schema:
        type: string
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
    Sha256Path:
      name: sha256
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Sha256"
    TusResumable:
      name: Tus-Resumable
      in: header
      required: true
      schema:
        type: string
        enum: ["1.0.0"]
    UploadOffset:
      name: Upload-Offset
      in: header
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    UploadLength:
      name: Upload-Length
      in: header
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    UploadMetadata:
      name: Upload-Metadata
      in: header
      required: true
      description: tus metadata, comma-separated `key base64(value)` pairs. Keys are defined in sync-protocol.md §7.3.
      schema:
        type: string
    UploadChecksum:
      name: Upload-Checksum
      in: header
      required: false
      description: Optional per-request checksum, `sha256 <base64 digest of this request body>`.
      schema:
        type: string
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
        example: bytes=0-1048575
  headers:
    TusResumable:
      schema:
        type: string
        example: 1.0.0
    UploadOffset:
      schema:
        type: integer
        format: int64
    UploadLength:
      schema:
        type: integer
        format: int64
    UploadExpires:
      description: HTTP-date after which the upload session expires.
      schema:
        type: string
    Location:
      description: URL of the upload resource.
      schema:
        type: string
    AssetId:
      description: Asset the upload resolved to.
      schema:
        type: string
        format: uuid
    AssetCreated:
      description: "`true` when this request created a new asset, `false` when it resolved to an existing one."
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    ETag:
      description: Quoted SHA-256 of the returned bytes.
      schema:
        type: string
  responses:
    BadRequest:
      description: "The request is malformed. Codes: `invalid_request`, `cursor_required`, `pairing_code_invalid`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "Missing or invalid credentials. Codes: `unauthorized`, `token_expired`, `refresh_token_reused`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "The caller may not access this resource, or a cookie-authenticated state-changing request lacks a valid `X-CSRF-Token`. Code: `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "Not found, or not generated yet. Codes: `not_found`, `not_ready`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "Codes: `length_mismatch`, `tombstoned`, `pair_primary_missing`, `setup_already_done`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: "`Tus-Resumable` is missing or unsupported. Code: `invalid_request`. `Tus-Version` lists the supported versions."
      headers:
        Tus-Version:
          schema:
            type: string
            example: 1.0.0
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: "The cursor is older than the change-log retention. Code: `cursor_expired`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: "Codes: `file_too_large`, `quota_exceeded`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RangeNotSatisfiable:
      description: "The Range header cannot be satisfied. Code: `invalid_request`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Locked:
      description: "Another request is writing to this upload. Code: `upload_locked`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UpgradeRequired:
      description: "The app is older than `min_client_version`. Code: `client_too_old`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: "Rate limited. Code: `rate_limited`."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ChecksumMismatch:
      description: "The bytes do not match the declared SHA-256. The upload session is discarded. Code: `checksum_mismatch`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: "Unexpected server error. Code: `internal`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: "Temporarily unavailable. Code: `server_unavailable`."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InsufficientStorage:
      description: "The server's disk is too full to accept this upload. Code: `insufficient_storage`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is stable and machine-readable; `title` and `detail` are for humans.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: urn:pictunnel:problem:offset_mismatch
        title:
          type: string
          example: Upload offset does not match
        status:
          type: integer
          example: 409
        detail:
          type: string
        code:
          type: string
          example: offset_mismatch
          x-known-values:
            - invalid_request
            - cursor_required
            - pairing_code_invalid
            - unauthorized
            - token_expired
            - refresh_token_reused
            - forbidden
            - not_found
            - not_ready
            - offset_mismatch
            - length_mismatch
            - tombstoned
            - pair_primary_missing
            - setup_already_done
            - cursor_expired
            - file_too_large
            - quota_exceeded
            - upload_locked
            - client_too_old
            - rate_limited
            - checksum_mismatch
            - internal
            - server_unavailable
            - insufficient_storage
        request_id:
          type: string
    Sha256:
      type: string
      description: Lowercase hex SHA-256 of the original bytes.
      pattern: "^[0-9a-f]{64}$"
      example: fbbab289f7f94b25736c58be46a994c441fd02552cc6022352e3d86d2fab7c83
    ServerInfo:
      type: object
      required: [server_id, name, version, api_version, min_client_version, capabilities, upload, time]
      properties:
        server_id:
          type: string
          format: uuid
        name:
          type: string
          example: Home server
        version:
          type: string
          example: 0.1.0
        api_version:
          type: string
          example: "1.0"
        min_client_version:
          $ref: "#/components/schemas/ClientVersions"
        capabilities:
          type: array
          items:
            type: string
            x-known-values: [tus, ml, share_links, search]
        upload:
          $ref: "#/components/schemas/UploadLimits"
        time:
          type: string
          format: date-time
          description: Server clock, for skew diagnostics only.
    ClientVersions:
      type: object
      required: [android, ios, web]
      properties:
        android:
          type: string
          example: 0.1.0
        ios:
          type: string
          example: 0.1.0
        web:
          type: string
          example: 0.1.0
    UploadLimits:
      type: object
      required: [tus_version, max_file_bytes, recommended_chunk_bytes]
      properties:
        tus_version:
          type: string
          example: 1.0.0
        max_file_bytes:
          type: integer
          format: int64
          example: 53687091200
        recommended_chunk_bytes:
          type: integer
          format: int64
          example: 8388608
    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[a-z0-9._-]+$"
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 256
        display_name:
          type: string
          maxLength: 100
    SetupResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    DeviceRegistration:
      type: object
      required: [device_name, platform, app_version]
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Pixel 9
        platform:
          type: string
          enum: [android, ios, web, other]
        app_version:
          type: string
          example: 0.1.0
    LoginRequest:
      type: object
      required: [username, password, mode]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        mode:
          type: string
          enum: [tokens, cookie]
        device:
          $ref: "#/components/schemas/DeviceRegistration"
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        device:
          $ref: "#/components/schemas/Device"
        tokens:
          $ref: "#/components/schemas/TokenPair"
        csrf_token:
          type: string
          description: Present in cookie mode; send as `X-CSRF-Token`.
    User:
      type: object
      required: [id, username, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          x-known-values: [admin, user]
    TokenPair:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        access_token:
          type: string
          example: pt_at_3q2-7wEXAMPLEtokenvalue
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          example: pt_rt_9fEXAMPLErefreshvalue
        refresh_token_expires_at:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    PairingCode:
      type: object
      required: [code, qr_uri, expires_at]
      properties:
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$"
          example: K7Q2-M9XD-4T
        qr_uri:
          type: string
          example: pictunnel://pair?v=1&sid=01928f3e-7b2a-7c4d-9e1f-2a3b4c5d6e7f&code=K7Q2-M9XD-4T&fp=xKecCxNIWtM6GstVge3d62YGSu9rChlvCqOALKreFGc&u=https%3A%2F%2F192.168.1.20%3A8443
        expires_at:
          type: string
          format: date-time
    RedeemRequest:
      type: object
      required: [code, device]
      properties:
        code:
          type: string
        device:
          $ref: "#/components/schemas/DeviceRegistration"
    RedeemResponse:
      type: object
      required: [server_id, user, device, tokens]
      properties:
        server_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        device:
          $ref: "#/components/schemas/Device"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    Device:
      type: object
      required: [id, name, platform, app_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          x-known-values: [android, ios, web, other]
        app_version:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    DevicePatch:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    CheckItem:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        local_id:
          type: string
          maxLength: 512
          description: Device-local identifier; linked to the asset when the verdict is `exists`.
        confirm_on_disk:
          type: boolean
          default: false
          description: Ask the server to stat the original and report `on_disk` (used before freeing space).
    CheckRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CheckItem"
    UploadRef:
      type: object
      required: [id, url, offset, length, expires_at]
      properties:
        id:
          type: string
        url:
          type: string
          example: /api/v1/uploads/01928f40-1111-7aaa-8bbb-0123456789ab
        offset:
          type: integer
          format: int64
        length:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
    CheckResult:
      type: object
      required: [sha256, verdict]
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        verdict:
          type: string
          x-known-values: [exists, missing, partial, tombstoned]
        asset_id:
          type: string
          format: uuid
        asset_state:
          type: string
          x-known-values: [active, trashed]
        has_live_video:
          type: boolean
        on_disk:
          type: boolean
        upload:
          $ref: "#/components/schemas/UploadRef"
        deleted_at:
          type: string
          format: date-time
    CheckResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
    LiveVideo:
      type: object
      required: [sha256, size_bytes, mime]
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        size_bytes:
          type: integer
          format: int64
        mime:
          type: string
          example: video/quicktime
    Asset:
      type: object
      required: [id, sha256, size_bytes, mime, kind, filename, taken_at_source, state, thumbnails_ready, created_at, updated_seq]
      properties:
        id:
          type: string
          format: uuid
        sha256:
          $ref: "#/components/schemas/Sha256"
        size_bytes:
          type: integer
          format: int64
        mime:
          type: string
          example: image/heic
        kind:
          type: string
          x-known-values: [photo, video, live_photo]
        filename:
          type: string
          example: IMG_0042.HEIC
        taken_at:
          type: string
          format: date-time
          nullable: true
        taken_at_offset_minutes:
          type: integer
          nullable: true
        taken_at_source:
          type: string
          x-known-values: [exif, container, client, file, unknown]
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        duration_ms:
          type: integer
          format: int64
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
        state:
          type: string
          x-known-values: [active, trashed]
        trashed_at:
          type: string
          format: date-time
          nullable: true
        stack_id:
          type: string
          format: uuid
          nullable: true
        live_video:
          $ref: "#/components/schemas/LiveVideo"
        thumbnails_ready:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_seq:
          type: integer
          format: int64
    ChangeEntry:
      type: object
      required: [seq, kind]
      properties:
        seq:
          type: integer
          format: int64
        kind:
          type: string
          x-known-values: [asset.upsert, asset.removed]
        asset:
          $ref: "#/components/schemas/Asset"
        asset_id:
          type: string
          format: uuid
          description: Present for `asset.removed`.
    ChangesPage:
      type: object
      required: [changes, next_cursor, has_more]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEntry"
        next_cursor:
          type: string
        has_more:
          type: boolean
    SnapshotPage:
      type: object
      required: [assets, has_more]
      properties:
        cursor:
          type: string
          description: Present on the first page only. Continue with getChanges from here after the last page.
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        next_page_token:
          type: string
          nullable: true
        has_more:
          type: boolean
    AssetIdList:
      type: object
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid
    BulkFailure:
      type: object
      required: [asset_id, code]
      properties:
        asset_id:
          type: string
          format: uuid
        code:
          type: string
          x-known-values: [not_found, not_trashed]
    BulkResult:
      type: object
      required: [succeeded, failed]
      properties:
        succeeded:
          type: array
          items:
            type: string
            format: uuid
        failed:
          type: array
          items:
            $ref: "#/components/schemas/BulkFailure"
    EmptyTrashResult:
      type: object
      required: [purged_count]
      properties:
        purged_count:
          type: integer
    Tombstone:
      type: object
      required: [sha256, filename, deleted_at]
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        filename:
          type: string
        deleted_at:
          type: string
          format: date-time
    TombstonePage:
      type: object
      required: [tombstones, has_more]
      properties:
        tombstones:
          type: array
          items:
            $ref: "#/components/schemas/Tombstone"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
