name: ci-ml
on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ci-ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ci-ml.yml"]
permissions:
  contents: read
jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:ml
