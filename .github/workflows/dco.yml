name: dco
on:
  pull_request:
permissions:
  contents: read
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/ci/check-dco.mjs "origin/$BASE_REF" HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
