name: ci-mobile
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
    paths: ["mobile/**", "api/protocol/**", "server/**", "Taskfile.yml", "tools/ci/android-instrumented.sh", "tools/ci/android-e2e.sh", ".github/workflows/ci-mobile.yml"]
  pull_request:
    paths: ["mobile/**", "api/protocol/**", "server/**", "Taskfile.yml", "tools/ci/android-instrumented.sh", "tools/ci/android-e2e.sh", ".github/workflows/ci-mobile.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # flutter analyze, flutter test (unit, widget, vectors and goldens), a debug APK and a
  # release APK (R8/minify issues show up only in release).
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - id: flutter
        run: echo "version=$(cat mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # A zone east of UTC, so the month-boundary tests see local and UTC months differ.
      - run: task test:mobile TOOLS_MODE=native
        env:
          TZ: Asia/Kolkata
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golden-failures
          path: mobile/test/**/failures/
          if-no-files-found: ignore
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug
      # Still signed with the debug key (see the TODO in android/app/build.gradle.kts).
      - name: Build Android release APK
        working-directory: mobile
        run: flutter build apk --release
      # Sideloadable builds for testing on a phone (docs/prototype-android.md).
      - name: Upload the debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pictunnel-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload the release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pictunnel-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # Regenerating the Pigeon bridge must reproduce the committed Dart, Kotlin and Swift.
  pigeon-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - id: flutter
        run: echo "version=$(cat mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task gen:pigeon TOOLS_MODE=native
      - name: Fail on drift
        run: |
          git status --porcelain -- mobile
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- mobile/lib/core/engine mobile/android/engine/src/main/kotlin mobile/ios/Engine/Sources)"

  # The generated Kotlin OpenAPI client and its vector tests.
  engine-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:kotlin TOOLS_MODE=native

  # Android engine JVM tests (Robolectric, vectors) plus the real-server integration tests.
  # Java 21: Robolectric's Android SDK 36 sandbox does not run on 17.
  engine-android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - id: flutter
        run: echo "version=$(cat mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      # The :engine module compiles against the Flutter embedding of this SDK.
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # Flutter keeps the Gradle wrapper scripts out of git and writes them on its first build;
      # this job runs Gradle without a Flutter build, so it uses the wrapper's version directly.
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "9.1.0"
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:engine:android TOOLS_MODE=native GRADLE_CMD=gradle
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: engine-android-unit-reports
          path: mobile/android/engine/build/reports/tests/
          if-no-files-found: ignore

  # Instrumented tests on an API 34 emulator: scan, WorkManager, Keystore, the delete
  # dialog, the partial-access run and a smoke launch of the app with the real bridge.
  engine-android-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - id: flutter
        run: echo "version=$(cat mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # Build everything before the emulator boots, so the emulator step only installs and runs.
      - name: Build the app and the engine test APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug
          (cd android && ./gradlew :engine:assembleDebugAndroidTest --no-daemon)
      - name: Instrumented tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/android-instrumented.sh
      - name: Upload reports and logcat
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: engine-android-instrumented
          path: |
            mobile/android/engine/build/reports/androidTests/
            mobile/android/engine/build/outputs/androidTest-results/
            .cache/instrumented/
          if-no-files-found: ignore

  # The first real backup end to end (tools/ci/android-e2e.sh): pictunnel serve built from this
  # commit on the runner, reached from an API 34 emulator at 10.0.2.2; pairing, a MediaStore
  # photo, a sync run through the real EngineHost, then the asset checked on the server.
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - id: flutter
        run: echo "version=$(cat mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: Build pictunnel
        working-directory: server
        run: CGO_ENABLED=0 go build -o ../.cache/pictunnel ./cmd/pictunnel
      # Flutter writes the Gradle wrapper on its first build.
      - name: Build the engine test APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug
          (cd android && ./gradlew :engine:assembleDebugAndroidTest --no-daemon)
      - name: End-to-end backup (API 34)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/android-e2e.sh
      - name: Upload server log, logcat and responses
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-e2e
          path: .cache/e2e/
          if-no-files-found: ignore

  # The iOS engine on macOS (unit, vectors, real-server integration over pinned TLS), the
  # generated Swift client, and the Runner app with every iOS adapter compiled.
  engine-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: task test:engine:ios TOOLS_MODE=native
      - name: Swift EngineAPI tests
        if: ${{ !cancelled() }}
        run: swift test --package-path mobile/ios/EngineAPI
      - id: flutter
        if: ${{ !cancelled() }}
        run: echo "version=$(cat mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        if: ${{ !cancelled() }}
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # Runs even when swift test failed, so one run reports both.
      - name: Build iOS without code signing
        if: ${{ !cancelled() }}
        working-directory: mobile
        run: flutter pub get && flutter build ios --debug --no-codesign
